<head>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0f2c;--ink2:#121a44;--line:#27316a;--tx:#e9edff;--mut:#9aa6dd;--blue:#5b74ff;--mint:#5ff0c8;--amb:#ffc857;--vio:#9d8cff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.55 "Space Grotesk",system-ui,sans-serif;color:var(--tx);background:var(--ink);
background-image:radial-gradient(circle at 1px 1px,#1d2762 1px,transparent 0);background-size:26px 26px}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 80px}
header{padding:28px 0 8px}
.toks{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.toks span{font-size:clamp(22px,6vw,40px);font-weight:700;line-height:1.1;padding:4px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--ink2)}
.toks span:nth-child(2){border-color:var(--blue)}
.toks span:nth-child(4){border-color:var(--mint);color:var(--mint)}
.sub{color:var(--mut);margin:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:18px 0 10px;scrollbar-width:none}
.tabs button{flex:0 0 auto;font:inherit;color:var(--mut);background:var(--ink2);border:1.5px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
.tabs button.on{color:var(--ink);background:var(--mint);border-color:var(--mint);font-weight:700}
.tabs button.off{opacity:.45}
h2{margin:6px 0 2px;font-size:22px}
.bar{height:6px;background:var(--ink2);border-radius:3px;margin:10px 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--mint));transition:width .4s}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
.tools input{flex:1 1 200px;font:inherit;color:var(--tx);background:var(--ink2);border:1.5px solid var(--line);border-radius:8px;padding:9px 12px}
.chips button{font:inherit;font-size:14px;color:var(--mut);background:none;border:1.5px solid var(--line);border-radius:20px;padding:6px 12px;cursor:pointer}
.chips button.on{color:var(--tx);border-color:var(--blue);background:var(--ink2)}
details{background:var(--ink2);border:1.5px solid var(--line);border-radius:10px;margin:0 0 10px}
details[open]{border-color:var(--blue)}
summary{cursor:pointer;padding:14px 16px;list-style:none;display:flex;gap:12px}
summary::-webkit-details-marker{display:none}
summary b{color:var(--vio);min-width:34px}
summary.done q{opacity:.55}
.a{padding:2px 16px 16px 62px}
.a .ans{margin:0 0 8px;padding-left:12px;border-left:3px solid var(--mint);font-weight:500}
.a .why{margin:0 0 10px;color:var(--mut);font-size:15px}
.m{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.m s{display:flex;gap:3px;text-decoration:none}
.m s u{width:16px;height:6px;border-radius:2px;background:var(--line);text-decoration:none}
.v u.f{background:var(--mint)}.l u.f{background:var(--blue)}.c u.f{background:var(--amb)}
.ok{margin-left:auto;font:inherit;font-size:13px;color:var(--ink);background:var(--mint);border:0;border-radius:6px;padding:5px 10px;cursor:pointer}
.ok.d{background:none;color:var(--mint);border:1.5px solid var(--mint)}
.soon{padding:40px 0;text-align:center;color:var(--mut)}
.leg{font-size:13px;color:var(--mut);margin:0 0 14px}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:520px){.a{padding-left:16px}}
#mode{margin:14px 0 4px}
.tq{background:var(--ink2);border:1.5px solid var(--blue);border-radius:10px;padding:18px 16px;margin-bottom:12px}
.tq h3{margin:0 0 14px;font-size:19px;font-weight:500}
.tq .tn{color:var(--vio);font-size:14px;margin-bottom:6px}
.tq .ans{margin:0 0 8px;padding-left:12px;border-left:3px solid var(--mint);font-weight:500}
.tq .why{margin:0 0 10px;color:var(--mut);font-size:15px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btns button{font:inherit;border-radius:8px;padding:10px 16px;border:1.5px solid var(--line);color:var(--tx);background:var(--ink);cursor:pointer}
.btns .y{background:var(--mint);color:var(--ink);border-color:var(--mint);font-weight:700}
.btns .no{border-color:var(--amb);color:var(--amb)}
.btns button:disabled{opacity:.4;cursor:not-allowed}
.sc{font-size:34px;font-weight:700;color:var(--mint);margin:0 0 6px}
.opts{display:grid;gap:8px}
.op{font:inherit;text-align:left;display:flex;gap:10px;color:var(--tx);background:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;cursor:pointer}
.op b{color:var(--vio);flex:0 0 auto}
.op.good{border-color:var(--mint);background:#0e2f33}
.op.bad{border-color:var(--amb);background:#33280f}
.op:disabled{cursor:default;color:var(--tx)}
</style>
</head>

<script>
window.W1={t:"The AI Tools Landscape",q:[
[1,"What distinguishes generative AI from a traditional program?","U yangi kontent (matn, rasm, kod) yaratadi; oddiy dastur esa oldindan yozilgan qoidalarni bajaradi.","Dastur = if-then. GenAI = ma'lumotdan o'rgangan naqshlar asosida har safar yangi natija 'ishlab chiqaradi'.","l"],
[2,"How does a large language model produce an answer?","Keyingi token (so'z bo'lagi)ni ehtimollik bo'yicha ketma-ket tanlab yozadi.","Bilimni 'o'qib' emas, naqshni davom ettirib yozadi, shuning uchun ravon, lekin xato bo'lishi mumkin.","l"],
[3,"The term 'hallucination' in AI means:","Ishonchli ohangdagi, lekin yolg'on gap yoki yolg'on manba.","Mock Exam glossariyi: 'a confident but false statement or source'. Ishonchli ohang = haqiqat emas.","v"],
[4,"Which is a known weakness of generative AI?","Hallucination: xato faktni ishonch bilan aytadi. Aniq hisob-kitob va yangi/mahalliy faktlarda ham xato qiladi.","Savol variantlari PDF'da yo'q; shu uchta zaif nuqta Week 3 mavzusi bilan mos.","l"],
[5,"Which Claude feature is a 'work folder' with standing instructions and files?","Project.","Qoidalarni har safar qayta yozmaysiz: Project ichidagi hamma chatlar doimiy ko'rsatma va fayllardan foydalanadi.","v"],
[6,"Artifacts in Claude are best described as:","Chat yonida ochiladigan mustaqil natija: jadval, hujjat, kichik ilova. Uni tahrirlash va qayta so'rash mumkin.","Seminar: 'Watch the Artifact open on the right', keyin 'Remove Friday and add colour' deb o'zgartirasiz.","v"],
[7,"Which Claude model is the smallest and fastest?","Haiku.","Tartib: Haiku (kichik, tez, arzon) → Sonnet (o'rta) → Opus (eng katta, eng kuchli).","v"],
[8,"What is the CCAO-F passing score?","720 / 1000 (≈72%).","Mock Exam oxirida: 'pass mark 720 ≈ 22 correct' (30 ta savoldan). Eslab qoling: 7-2-0.","v"],
[9,"How many items and how long is the CCAO-F exam?","60 ta savol, 120 daqiqa (savolga ≈2 daqiqa).","Bankdagi Q292 va Q294 shuni aytadi. Mock Exam qisqa variant: 30 ta / 60 daqiqa.","v"],
[10,"Which statement about the four leading assistants is correct?","Asosiy imkoniyatlari o'xshash, farqi funksiya va sifatda; hammasi xato qilishi mumkin, shuning uchun bir xil promptni solishtirib tekshiring.","Variantlar PDF'da yo'q. Darsdagi aniq to'rt vosita ro'yxati Drive'da topilmadi.","c"],
[11,"Why is the course name tool-agnostic (not tied to one product)?","Vositalar tez o'zgaradi, lekin prompting, tekshirish va mas'uliyat ko'nikmalari har qanday vositada ishlaydi.","Q66 va Q116 ham shu g'oya: tushunchalarning vositalararo ekvivalenti bor.","l"],
[12,"Which of these is an example of 'learning' AI rather than generative AI?","Ma'lumotdan naqsh o'rganib bashorat yoki tasnif qiladigan tizim: spam-filtr, tavsiya tizimi, kredit skoringi.","U yangi kontent yaratmaydi, faqat 'bu qaysi sinf?' yoki 'nima bo'ladi?' ga javob beradi.","l"],
[13,"What is the first rule when registering AI accounts in this course?","Manba topilmadi: Drive'da bu qoida yo'q. Mantiqiy taxmin: faqat o'z shaxsiy hisobingiz va xavfsiz ma'lumot.","Aniq javob uchun Week 1 lecture slaydini oching.","c"],
[14,"The daily message limit on a free plan is reached. What is the right reaction?","Limitni aylanib o'tishga urinmang. Tiklanishini kuting, boshqa vositaga o'ting, oddiy ishga kichik model ishlating.","Mock Q29 va Q95: tejamkorlik = oddiy qadamga kichik model.","l"],
[15,"Which is NOT one of the five tool categories from the lecture?","Beshta kategoriya ro'yxati Drive'da yo'q. Bankdan ko'rinadiganlari: chat assistantlar, research, agentic vositalar, built-in AI.","To'liq ro'yxatni lecture slaydidan tekshiring.","c"],
[16,"A fluent, well-written AI answer is:","Faqat ravon matn, to'g'riligining isboti emas. Tekshirish kerak.","'Probability ≠ truth': model ehtimoli yuqori so'zni tanlaydi, rost so'zni emas.","v"],
[101,"A tourism student asks an AI for the opening hours of a small museum in Samarkand and gets a confident answer. What should she do before telling a client?","Rasmiy manba (muzey sayti yoki telefon)dan tasdiqlaydi.","Kichik mahalliy mavzu = hallucination xavfi yuqori. Ishonchli ohangga ishonmang.","l"],
[102,"Which description fits Research in Claude?","Veb'ni ko'p bosqichda qidirib, manbali (havolali) hisobot qaytaradigan agent-tipidagi funksiya.","Mock Q13 va bankdagi Q74. Havolalarni baribir o'zingiz ochib tekshirasiz (Q147).","v"],
[103,"Which free-plan statement is correct for this course?","Manba topilmadi. Bankdan ko'rinadi: bepul reja kurs uchun yetadi, lekin kunlik limit bor va ba'zi funksiyalar (Research, connector) cheklangan.","Q14, Q214, Q257 shunga ishora qiladi. Aniq gapni slayddan tekshiring.","c"],
[104,"Which exam fact about CCAO-F is correct?","60 savol, 120 daqiqa, o'tish bali 720/1000, 7 ta domen.","Domenlar: Prompting, Verification, Model tanlash, Workflows, Configuration, Responsibility, Troubleshooting (Week 6 seminar jadvali).","v"],
[105,"The best analogy for a language model from the lecture is:","Manba topilmadi. Mantiqiy taxmin: juda kuchli 'avto-to'ldirish' (autocomplete).","Dars analogiyasi aniq nima ekanini slaydda tekshiring.","c"],
[106,"Why is 'probability ≠ truth' important for AI users?","Model eng ehtimolli davomni yozadi, tekshirilgan haqiqatni emas, shuning uchun ishonarli matn ham noto'g'ri bo'lishi mumkin.","Shu sabab Week 3 (tekshirish) kursning markazi.","v"],
[107,"An ACCA student wants help reading a financial statement. Which tool category is the right starting point?","Umumiy chat-assistant: hujjatni yuklab, tushuntirishni so'rash.","Rasm/video yoki kod vositasi emas, matn va jadvalni tushuntirish chat ishi.","l"],
[108,"Which is the correct order of the three model sizes from smallest to largest?","Haiku → Sonnet → Opus.","Eslash: H-S-O, 'Haiku she'ri qisqa', Opus katta asar.","v"],
[109,"The rule of thumb for choosing a model size is:","O'rtadan boshlang (Sonnet). Oddiy ko'p hajmli ishda kichikka tush, murakkab ishda kattaga chiq.","Bankdagi Q165 'Start in the middle'. Trade-off: tezlik, narx, sifat, uchalasini birdan oshirib bo'lmaydi.","v"],
[110,"Which item is NOT part of the course rules from day one?","Qoidalarga zid variant noto'g'ri javob: masalan, 'AI javobiga tekshirmay ishonish'.","Kurs qoidalari: tekshirish, shaxsiy ma'lumotni yuklamaslik, AI ishlatilganini e'lon qilish.","l"],
[111,"A business student compares three assistants with the same prompt. What is the purpose of this exercise?","Bir xil topshiriqda vositalarni mezonlar bo'yicha solishtirish: qaysi vosita qaysi ishga mos ekanini ko'rish.","5 mezon: Accuracy, Completeness, Clarity, Format, Usefulness (har biri 1–5, jami 25).","v"],
[112,"Which is an example of 'built-in AI'?","Mavjud ilova ichiga o'rnatilgan AI: Word, Docs, Gmail, Excel ichidagi yordamchi yoki telefon klaviaturasi.","Alohida chat ochmaysiz, AI siz ishlayotgan ilovaning ichida.","l"],
[113,"A student says 'the AI said so' as evidence in a portfolio entry. According to the course rules this is:","Qabul qilinmaydi: AI manba emas, haqiqiy manba bilan tasdiqlash kerak.","Portfolio yozuvida alohida '5. Check' bo'limi bor: AI nima dedi, manba nima dedi.","v"],
[114,"What does an Artifact that is 'a small app without code' illustrate?","Kod yozmasdan, oddiy tilda tavsiflab foydali vosita (kalkulyator, quiz) yaratish mumkinligini.","Seminar: quiz, kalkulyator, balans jadvali artifactlari.","v"],
[115,"Which 2023–2025 achievement was mentioned as an AI 'wow fact'?","AI tadqiqotlari uchun Nobel mukofoti (2024): Fizika, Hopfield va Hinton; Kimyo, Hassabis, Jumper va Baker (AlphaFold).","Bankdagi Q208 ham Nobel'ni eslatadi.","v"],
[116,"The same 'engine' (model) can power many products. For students this means:","Mahsulotlar funksiyasi bilan farqlanadi, ko'nikmalar esa vositalar o'rtasida ko'chadi.","Shu sabab kurs bitta vositaga bog'lanmagan.","l"],
[201,"How many credits and weeks does this course have?","Manba topilmadi: Syllabus papkasi Drive'da bo'sh.","Silabusni PDF qilib yuboring, aniq raqamni qo'shaman.","c"],
[202,"How many points does the final exam carry, and how can a student be exempted from it?","Manba topilmadi (silabus kerak).","Yuqoridagi savol bilan bir xil: silabus kerak.","c"],
[203,"A certificate score of 800/1000 converts to how many final-exam points?","Manba topilmadi (konvertatsiya jadvali silabusda).","Formulani o'ylab topmayman, chunki xato raqam yodlanib qoladi.","c"],
[204,"Which week holds the midterm exam?","Week 7.","Bank sarlavhasi: 'The midterm (Week 7, 40 items, 80 minutes, on paper)'.","v"],
[205,"What is the minimum semester score needed to be admitted to the final exam?","Manba topilmadi (silabus kerak).","Silabus yuborilsa to'ldiriladi.","c"],
[206,"Which description matches 'agentic tools'?","Ko'p bosqichli ishni o'zi bajaradigan vositalar (brauzer, fayl, ilova bilan ishlaydi), faqat javob yozib qo'ymaydi.","Chat javob beradi; agent reja tuzadi va harakat qiladi (Q73).","l"],
[207,"Which ChatGPT/Gemini equivalents exist for Claude's Haiku/Sonnet/Opus idea?","Har kompaniyada kichik-tez, o'rta va katta daraja bor (masalan Gemini'da Flash va Pro).","Nomlar o'zgaradi, g'oya bir xil. Hozirgi aniq nomlarni slayddan tekshiring.","l"],
[208,"The lecture's 'wow fact' about the Nobel Prize referred to:","2024 yilgi Nobel mukofotlari AI bilan bog'liq ishlarga berilgani.","Fizika (Hopfield, Hinton) va Kimyo (Hassabis, Jumper, Baker).","v"],
[209,"What should a student do if the phone-verification step fails during sign-up?","Manba topilmadi. Umumiy: o'qituvchiga xabar bering; birovning raqamidan yoki soxta ma'lumotdan foydalanmang.","Aniq kurs yo'riqnomasini slayddan tekshiring.","c"],
[210,"Which portfolio component carries 10 points across the semester and is built from seminar entries?","Portfolio.","Har seminar yozuvi portfolioga kiradi, masalan #6 yozuvi 1 ball (Week 6 seminar).","v"],
[211,"What is the letter grade range for 'M' (Good)?","Manba topilmadi (baholash jadvali silabusda).","Silabus yuborilsa to'ldiriladi.","c"],
[212,"Which item is in the 'good at' column for generative AI?","Yozish, qayta yozish, tarjima, tushuntirish, qisqartirish, reja, g'oya, formatlash.","Week 1 seminar savollari: Explain, Rewrite, Translate, Plan.","l"],
[213,"In the week-1 seminar, the 'Find the error' task asks students to:","AI'ga oson tekshiriladigan savol berish, rasmiy manbada tekshirish, farqni yozish, 'Show me your source' deb so'rash.","Oxirida 1 gaplik xulosa: bu tajriba AI haqida nimani ko'rsatdi.","v"],
[214,"Claude's Research is 'teacher demo only' in this course because:","Manba topilmadi. Taxmin: bepul rejada yo'q yoki juda ko'p resurs sarflaydi.","Slayddan tekshiring.","c"],
[215,"Which best describes the certification ladder?","Manba topilmadi. CCAO-F boshlang'ich pog'ona; yuqori darajalar nomi slaydda.","Savolning to'g'ri varianti faqat imtihonda ko'rinadi.","c"],
[216,"Which action violates the course's academic-integrity rule?","AI ishini o'zinikidek topshirish, AI ishlatilganini yashirish, tekshirilmagan faktni qo'yish.","Mock Q25: AI ishlatilsa, aniq e'lon va faktlarni tekshirish shart.","v"]
]};
</script>
<script>
window.W2={"t": "Prompting", "q": [[17, "Which are the five elements of an effective prompt?", "Role, Instruction, Context, Format + beshinchi element (odatda Constraints yoki Example).", "Mock Q2 to'rttasini ko'rsatadi: Role, Instruction, Context, Format. Beshinchisi nomini slaydda tekshiring.", "c"], [18, "\"You are an experienced ACCA tutor\" is an example of which element?", "Role (rol).", "Mock Q2: 'You are an experienced accountant' = Role. AI qaysi nuqtai nazardan javob berishini belgilaydi.", "v"], [19, "\"As a table, in Uzbek, no more than 150 words\" specifies the:", "Format (va cheklovlar: til, hajm).", "'Jadval, o'zbek tilida, 150 so'zdan kam' = javob qanday ko'rinishda bo'lishi.", "v"], [20, "Giving 1–2 samples of the desired output is called:", "Few-shot prompting (namuna berish).", "1–2 ta kerakli natija namunasini ko'rsatasiz, AI uslubni takrorlaydi.", "l"], [21, "\"Write about marketing\" is weak mainly because it lacks:", "Context (kim uchun, nima uchun) va format yetishmaydi.", "Mock Q1: eng samarali birinchi o'zgarish aynan context va format qo'shish.", "v"], [22, "Breaking a big task (e.g., coursework) into topic → plan → sources → draft → check is called:", "Decomposition (vazifani bo'laklash).", "Mavzu → reja → manbalar → qoralama → tekshiruv: 5 qadam, har birini tekshirasiz.", "v"], [23, "The first AI answer should be treated as:", "Qoralama sifatida: uni yaxshilash (iteratsiya) kerak.", "Mock Q4: o'chirib qayta boshlamang, 'qisqartir, ohangini o'zgartir' deb so'rang.", "v"], [24, "Which request is an example of asking for a critique (iteration)?", "Masalan: 'Bu javobning zaif tomonlarini ayt va nimani o'zgartirasan?'", "Tanqid so'rash AI'ni o'z natijasini qayta ko'rishga majbur qiladi.", "l"], [25, "When is \"think step by step\" most useful?", "Ko'p bosqichli mantiq yoki hisob-kitobda, oraliq qadamlar muhim bo'lganda.", "Oddiy faktga 'step by step' kerak emas.", "l"], [26, "Which is a typical prompting mistake?", "Bir qatorli noaniq prompt, kontekstsiz; birinchi javobni qabul qilish.", "Boshqa xatolar: bir promptga ko'p vazifa, format aytilmagani.", "l"], [27, "A useful bilingual trick when a technical answer in Uzbek looks odd is to:", "Savolni inglizcha so'rab, keyin tarjima qilish yoki inglizcha atamani so'rash.", "Texnik mavzuda inglizcha ma'lumot ko'p, javob sifati yuqori bo'ladi.", "l"], [28, "Which use of AI for studying is consistent with academic integrity?", "Tushuntirtirish, o'zingizni test qildirish, yechim rejasi so'rash, va AI ishlatilganini e'lon qilish.", "Tayyor javobni o'zingizniki qilib topshirish integrity buzadi (Mock Q25).", "v"], [29, "For an analysis task, a good template asks the AI to:", "Taxminlarni aytsin, mezonlar bo'yicha tuzsin, xulosani birinchi qo'ysin va ishonchsiz joylarni belgilasin.", "Tahlil shabloni: tuzilma + asoslash + noaniqlikni ko'rsatish.", "l"], [30, "In a research-type prompt, which instruction reduces fabricated sources?", "'Faqat tekshirsa bo'ladigan manbalarni keltir; bilmasang, bilmayman de, o'ylab topma.'", "Bu uydirma manbalarni kamaytiradi, lekin havolani baribir o'zingiz tekshirasiz.", "l"], [31, "A personal prompt library is useful because:", "Sinalgan promptlarni qayta ishlatib, vaqt tejaysiz va sifat bir xil bo'ladi.", "Har safar noldan yozish o'rniga shablon kutubxonasi.", "l"], [32, "A student writes: \"I am a first-year student. Shorten the attached text to 5 points, one sentence each, as a numbered list.\" Which element is intentionally absent and acceptable here?", "Role (rol).", "Prompt'da context (birinchi kurs), instruction (qisqartir) va format (5 band) bor. Oddiy vazifaga rol shart emas.", "v"], [33, "Which is the best FIRST step when a brand description comes back generic?", "Context (kim uchun, qanday ohang) va format qo'shish.", "Mock Q1 va Q28: avval promptni tekshiring, keyin modelni.", "v"], [117, "An IT student writes: \"Fix this code.\" The AI changes the program's behaviour. What was missing?", "Context: kod nima qilishi kerakligi (kutilgan xatti-harakat), til va xato matni.", "Week 6 seminar, Troubleshooting 5: kontekstsiz AI kod mantiqini o'zgartirib yuboradi.", "v"], [118, "A tourism manager needs a 3-day itinerary table. Which prompt is best?", "Auditoriya, kunlar, jadval ustunlari va cheklov (byudjet) aniq yozilgan prompt.", "Yaxshi prompt = role + context + instruction + format.", "l"], [119, "\"First give me an outline; write the full text only after I approve\" is an example of:", "Bosqichma-bosqich ish va nazorat nuqtasi (checkpoint).", "Avval reja, tasdiqdan keyin to'liq matn: uzun, mavzudan chetga chiqqan matndan saqlaydi.", "l"], [120, "An ELT student asks for \"feedback on this essay\" and gets a rewritten essay instead. Which element would prevent this?", "Aniq instruction/cheklov: 'qayta yozma, faqat izoh ber, 3 kuchli va 3 zaif tomon'.", "Aks holda AI 'feedback'ni 'qayta yozib ber' deb tushunadi.", "l"], [121, "Which is the correct decomposition of \"prepare a monthly financial report\"?", "Ma'lumot yig'ish → tahlil → qoralama → tekshiruv → formatlash.", "Week 5 zanjiri (Q180) bilan bir xil mantiq.", "v"], [122, "Which iteration phrase asks the AI to expose its own uncertainty?", "'Qaysi qismlarda ishonching past? Qanday taxmin qilding?'", "AI'ni noaniqligini ochiq aytishga undaydi (Q238).", "l"], [123, "Too many examples in a few-shot prompt can cause the AI to:", "Namunani ortiqcha takrorlaydi, javob qotib qoladi va moslashuvchanligi kamayadi.", "1–2 ta yetarli.", "l"], [124, "A brainstorming template that asks for \"5 conventional and 5 unexpected ideas, then justify the best 3\" is good because it:", "Avval kenglik (oddiy va kutilmagan g'oyalar), keyin asoslash beradi, shu sabab sifat oshadi.", "Natijada eng yaxshi 3 ta g'oya asoslangan bo'ladi.", "l"], [125, "Which prompt best supports learning (not cheating) before an exam?", "'Imtihon savoli uchun yechim rejasi ber, qadamlarni, javobni emas' yoki 'meni test qil'.", "Bu o'rganish; tayyor javob olish esa aldash (Q223).", "v"], [126, "When should a student prefer asking in English?", "Texnik, dasturlash va maxsus atamali mavzularda.", "Inglizcha ma'lumot ko'p; keyin o'zbekchaga tarjima qilib tekshiring.", "l"], [127, "Which is the correct pre-send check question?", "'Prompt boshqa odamga tushunarlimi, rol/kontekst/format/cheklov bormi, keyin nima qilaman?'", "6 savollik tekshiruvning aniq ro'yxati Drive'da yo'q.", "c"], [128, "A business student gets a SWOT with vague items. The best iteration is:", "Aniqlashtiring: kompaniya, soha, 'har bandga raqam yoki misol qo'sh'.", "Noaniq SWOT'ga context va dalil qo'shiladi.", "l"], [129, "In the prompt anatomy example, which element usually causes the biggest quality loss when removed?", "Context.", "Kontekst yo'q bo'lsa AI bo'shliqni umumiy gaplar bilan to'ldiradi.", "l"], [130, "\"Explain this term to a first-year student with an everyday example\" — the audience statement here serves as:", "Context (auditoriya).", "Kim o'qishini aytsangiz, til va daraja moslashadi.", "l"], [131, "A prompt chain for a weekly report is stored in a Project. What benefit does the Project add?", "Qoidalar, shablon va zanjir qadamlari doimiy saqlanadi, har safar qayta tushuntirmaysiz.", "Mock Q15: standing instructions + files.", "v"], [132, "The portfolio entry for week 2 requires a prompt library of how many prompts?", "Manba topilmadi: Week 2 portfolio'dagi prompt soni slaydda.", "Taxminiy raqam aytmayman.", "c"], [133, "\"Role\" does NOT do which of the following?", "Rol uslub va nuqtai nazarni beradi, lekin yangi fakt bermaydi va to'g'rilikni kafolatlamaydi.", "Rol 'ekspert' bo'lsa ham javobni tekshirish shart.", "l"], [217, "Which element answers \"what exactly should the AI do?\"", "Instruction (vazifa).", "'Nima qilsin?' savoliga javob beradi.", "v"], [218, "Which rewrite strengthens the instruction \"Help me\"?", "Aniq vazifa + context + format qo'shilgan variant.", "Masalan: 'Rasmiy ohangda 150 so'zlik ariza yozishga yordam ber'.", "l"], [219, "A tourism student asks for a client email and gets a stiff, formal text for a young backpacker. Which element should change?", "Context (auditoriya) va ohang: yosh sayyoh uchun do'stona, norasmiy.", "Auditoriyani aytmasangiz AI rasmiy yozadi.", "l"], [220, "How many steps did the lecture's coursework decomposition example have?", "5 qadam.", "Mavzu, reja, manbalar, qoralama, tekshiruv.", "v"], [221, "\"Suggest 2 more different approaches\" is an iteration that:", "Alternativ variantlar so'raydi: yo'nalishni kengaytiradi.", "Iteratsiya turi: 'boshqa yondashuv ko'rsat'.", "l"], [222, "Which is the correct mnemonic order of the five elements (English version)?", "Manba topilmadi: ingliz mnemonikasi slaydda.", "Elementlar: Role, Instruction, Context, Format va yana bittasi.", "c"], [223, "An ACCA student asks: \"Give me a solution plan for this exam question — the steps, not the answer.\" This prompt is:", "Akademik halol va foydali: qadam so'raladi, tayyor javob emas.", "O'rganishni qo'llaydi.", "v"], [224, "\"Conclusion first, then the evidence\" is an instruction about:", "Javob tuzilmasi (format): avval xulosa, keyin dalil.", "Rahbarlarga mos tuzilma.", "l"], [225, "Which is the BEST use of a role for an IT student debugging code?", "Rol: tajribali kod tekshiruvchi, avval kod nima qilishi kerakligini so'raydi.", "Context bilan birga ishlaydi.", "l"], [226, "A student complains the AI \"forgot\" to use Uzbek in the answer. Most likely the prompt:", "Chiqish tili aniq aytilmagan.", "Mock Q30: tilni ochiq yozing va toza chat oching.", "v"], [227, "Which is NOT one of the four task types with templates from the lecture?", "To'rtta tur: yozish, tahlil, tadqiqot, g'oya (brainstorming). Boshqa har qanday tur 'NOT'.", "Q29, Q30, Q124 va yozish shabloni shuni ko'rsatadi; aniq ro'yxatni slaydda tekshiring.", "l"], [228, "\"First restate my question in your own words\" helps with which problem?", "AI vazifani noto'g'ri tushunishi muammosiga.", "AI avval so'rovni o'z so'zi bilan takrorlasa, noto'g'ri yo'nalish oldindan ko'rinadi.", "l"], [229, "A business student's pitch outline prompt: \"7 slides, each with a title and one key point.\" This specifies:", "Format va cheklov (tuzilma va hajm).", "7 slayd, har birida sarlavha va bitta asosiy fikr.", "l"], [230, "The 6-question pre-send check includes \"What next?\" meaning:", "Javobdan keyin nima qilaman: tekshiraman, iteratsiya qilaman, ishlataman.", "'What next?' prompt oxiridagi reja.", "l"], [231, "What happens when context is missing from a prompt?", "AI bo'shliqni taxmin yoki umumiy gap bilan to'ldiradi.", "Mock Q1: 'generic essay'.", "v"], [232, "Which step of the writing template protects against a long, off-target essay?", "Avval reja so'rash (outline), tasdiqlangandan keyin matn yozdirish.", "Uzun va mavzudan chetga chiqqan insho oldi olinadi.", "l"], [233, "The ELT prompt \"Simplify this text from B1 to A2 and highlight changed words\" demonstrates:", "Aniq daraja (B1 → A2) va natijada o'zgargan so'zlarni belgilash: instruction + format.", "Auditoriya darajasi aniq aytilgan.", "l"]]};
</script>

window.W3={"t": "Verification", "q": [[34, "Which is NOT one of the six hallucination types?", "Manba topilmadi: oltita tur ro'yxati slaydda.", "Misollar: uydirma fakt, uydirma manba, eskirgan ma'lumot, hisob xatosi, noto'g'ri nisbat, noaniq so'rov.", "c"], [35, "What did the 2023 New York lawyer case teach?", "Advokat AI uydirgan sud ishlarini sudga topshirgan; har bir manbani tekshirish shart.", "2023, Nyu-York. Havola chiroyli bo'lsa ham haqiqiy bo'lmasligi mumkin.", "l"], [36, "Which situation is HIGH risk and needs full verification?", "Moliyaviy, huquqiy, tibbiy yoki rahbariyatga boradigan raqamlar.", "Mock Q6: moliyaviy hisobot raqamlari eng yuqori xavf.", "v"], [37, "The four steps of checking a source are:", "Manba topilmadi: 4 qadam slaydda. Mantiqan: topish, ochish, da'voni tasdiqlash, ishonchlilik va sanani tekshirish.", "Mock Q5: manbani qidir, och, da'vo borligini tasdiqla.", "c"], [38, "A source is found but does not contain the claim the AI attributed to it. This is:", "Soxta atribusiya: manba bor, lekin da'vo unda yo'q (hallucination).", "Manba mavjudligi yetarli emas, mazmun ham tekshiriladi.", "l"], [39, "15% of 240,000 UZS is:", "36 000 UZS.", "240 000 × 0,15 = 36 000. Mock Q7'da AI 32 000 degan, bu xato.", "v"], [40, "Why should numbers from an AI be recalculated?", "Model matn bashorat qiladi, hisoblamaydi, shuning uchun hisobda xato qiladi.", "Mock Q7: raqamlar mustaqil qayta hisoblanadi.", "v"], [41, "Two tools give different answers. The correct response is:", "Mustaqil, ishonchli manbada tekshirish.", "Mock Q8: o'rtacha olmang, ishonchli ohangga qarab tanlamang.", "v"], [42, "Which is a warning sign of fabrication?", "Manbasiz juda aniq statistika, mukammal silliq iqtibos, topilmaydigan havola.", "Mock Q9: manbasiz aniq raqamlar belgisi.", "v"], [43, "\"Answer only from the attached text; do not go beyond it\" is an example of:", "Grounding (javobni berilgan matnga bog'lash).", "AI tashqariga chiqmaydi, uydirish kamayadi.", "l"], [44, "When is human review MANDATORY?", "Natija odamlar, pul, huquq yoki tashqi mijozga ta'sir qilganda.", "Q245: mijozga ketadigan xat odam tekshirgandan keyin yuboriladi.", "l"], [45, "Of the five comparison criteria, which must be satisfied first?", "Accuracy (to'g'rilik).", "Mezonlar tartibi: Accuracy, Completeness, Clarity, Format, Usefulness.", "v"], [46, "Which format fits data that will be imported into another program?", "CSV yoki JSON (tuzilgan, mashina o'qiydigan).", "Boshqa dasturga import uchun.", "l"], [47, "Editing an AI answer for a first-year student mainly means:", "Til soddalashtiriladi: qisqa gap, kundalik misol, atamasiz, faktlar saqlanadi.", "Birinchi kurs talabasi tushunadigan darajada.", "l"], [48, "Why are local facts (Uzbekistan, Tashkent) higher risk for hallucination?", "Mahalliy mavzuda ma'lumot kam, model taxmin qiladi.", "O'zbekiston va Toshkent faktlari rasmiy manbada tekshiriladi.", "l"], [49, "A financial analyst receives AI figures with two source links for a report. The most correct action is:", "Ikkala havolani ochish, raqamlarni manbada tekshirish, qayta hisoblash, keyin ishlatish.", "Moliyaviy hisobot yuqori xavf.", "v"], [50, "The fifth question before accepting an answer is:", "Manba topilmadi: beshinchi savol slaydda. Mantiqan: 'Xato bo'lsa nima bo'ladi?'", "Aniq matnni slayddan tekshiring.", "c"], [134, "An AI claims \"Tashkent has 12 million inhabitants\". Which hallucination type and check apply?", "Fakt xatosi (mahalliy raqam): Toshkent shahrida taxminan 3 million aholi, 12 million emas. Rasmiy statistikada tekshiring.", "Mahalliy raqamlarda uydirma xavfi yuqori.", "l"], [135, "An AI says IFRS 16 has been effective since 2010 and keeps leases off the balance sheet. The correct check reveals:", "IFRS 16 2019-yil 1-yanvardan kuchga kirgan va ijarachi ijarani balansga qo'yadi.", "AI ikki xil xato qilgan; standartni asl matnda tekshiring.", "l"], [136, "An AI reference lists a real professor as the author of a book that cannot be found anywhere. This is:", "Soxta manba: haqiqiy mutaxassis nomi bilan mavjud bo'lmagan kitob.", "Muallif haqiqiy bo'lsa ham kitob uydirma bo'lishi mumkin.", "l"], [137, "\"Studies show that 73.4% of users…\" without a source is:", "Manbasiz aniq statistika: uydirma belgisi.", "Manba so'rang va o'zingiz tekshiring.", "v"], [138, "The correct response when both tools agree on a fact is:", "Ishonch oshadi, lekin muhim ish bo'lsa baribir manbada tasdiqlang.", "Ikkalasi ham xato qilishi mumkin.", "l"], [139, "Which case requires a lawyer's review before use?", "Shartnoma yoki huquqiy matn: advokat ko'rigi kerak.", "Yuqori xavf: huquqiy oqibat.", "l"], [140, "An ELT teacher asks AI for CEFR level descriptors and gets \"CEFR has four levels: A1–B2\". The check shows:", "CEFR'da oltita daraja bor: A1, A2, B1, B2, C1, C2. AI noto'g'ri aytgan.", "Rasmiy CEFR hujjatida tekshiring.", "v"], [141, "A tourism student receives from AI a list of \"5 hotels in Bukhara with prices\". The medium-risk check is:", "Mehmonxonalar mavjudligini va narxlarni rasmiy sayt yoki bron platformasida tekshirish.", "O'rtacha xavf: narxlar o'zgaradi.", "l"], [142, "Which editing step turns a correct 180-word technical answer into something a first-year student can use?", "Soddalashtirish va kundalik misol qo'shish.", "Q47: o'quvchi tushunadigan til.", "l"], [143, "Which output format fits \"a comparison of three suppliers on five criteria\"?", "Jadval (taqqoslash jadvali).", "3 ta yetkazib beruvchi va 5 mezon matritsa shaklida.", "v"], [144, "A student says: \"I verified the answer by asking Claude if it was correct.\" Which verification mistake is this?", "Aylanma tekshiruv: AI o'zini o'zi tekshiryapti.", "Mustaqil manba kerak (Q195).", "v"], [145, "Grounding an answer means:", "Javobni berilgan matn yoki manbaga bog'lash.", "'Faqat ilova matnidan javob ber' (Q43).", "l"], [146, "Which is a LOW-risk use that needs only a read-through?", "Blog g'oyalari yoki xatni qayta yozish: o'qib chiqish yetadi.", "Mock Q6: past xavf.", "v"], [147, "The Research feature returns links. The user's remaining responsibility is to:", "Havolalarni ochib, da'vo manbada borligini tekshirish.", "Research manba beradi, lekin tekshirish sizda.", "v"], [148, "Why is \"one says I don't know\" a good sign when comparing two tools?", "Ishonch yo'q bo'lganda tan olish uydirmadan yaxshi.", "Noaniq javob afzal.", "l"], [149, "An IT student gets code from AI that \"looks right\". The proper medium-risk check is:", "Kodni ishga tushirib sinash (test), qirralarni tekshirish.", "'Ko'rinishi to'g'ri' kod ham xato qilishi mumkin.", "l"], [150, "Which best describes the difference between \"a source exists\" and \"a source is real\"?", "Manba bor bo'lishi uning haqiqiy va da'voni qo'llashi degani emas.", "Ochib, mazmunini tekshirish kerak.", "l"], [234, "An AI gives a detailed, confident answer about a very narrow local topic. Risk assessment:", "Yuqori xavf: tor mahalliy mavzuda ishonchli, batafsil javob uydirma bo'lishi mumkin.", "Rasmiy manba bilan tasdiqlang.", "l"], [235, "Which risk category applies to \"generating a list of blog ideas\"?", "Past xavf.", "Mock Q6: blog g'oyalari eng past xavf.", "v"], [236, "The AI's answer about last month's event is wrong because the model was trained earlier. Type:", "Eskirgan ma'lumot: model oldinroq o'qitilgan.", "Yechim: web-qidiruv yoki Research.", "l"], [237, "You asked about \"Python the language\" and the AI answered about the snake. Type:", "Noaniq so'rov (kontekst xatosi): 'Python' ilon deb tushunilgan.", "Kontekstni aniq yozing.", "l"], [238, "Which verification method is \"ask the AI where it is unsure\"?", "O'zini tekshirtirish: 'Qayerda ishonching past?'", "Foydali, lekin dalil emas (Q122).", "l"], [239, "A tourism student uses AI to translate a hotel description for clients. Appropriate check level:", "O'rtacha: nom, raqam va atamalarni tekshirish, ikkinchi odam ko'rishi.", "Mijozga boradigan matn.", "l"], [240, "Why is a \"perfect, smooth quote\" a warning sign?", "Haqiqiy iqtiboslar kamdan-kam mukammal; silliq iqtibos uydirma bo'lishi mumkin.", "Asl manbada tekshiring.", "v"], [241, "An IT student gets statistics from AI for a report. The AI can't name the source. Correct move:", "Manbasiz statistikani ishlatmang: manbasini o'zingiz toping yoki olib tashlang.", "Mock Q9.", "l"], [242, "Which is the right order of the five comparison criteria by priority?", "Accuracy, Completeness, Clarity, Format, Usefulness.", "Birinchi navbatda to'g'rilik.", "v"], [243, "A result \"to be used as a working tool\" should be requested as:", "Tuzilgan va tahrirlanadigan shakl: jadval, ro'yxat yoki Artifact.", "Ish quroli sifatida.", "l"], [244, "\"We are 100% certain that…\" in an answer to a complex, contested question is:", "Ogohlantiruvchi belgi: murakkab va bahsli savolda 100% aniqlik kamdan-kam.", "Nuansli javob ishonchliroq.", "l"], [245, "Before sending an AI-drafted letter to a real customer, the rule is:", "Mijozga yuborishdan oldin odam o'qib, tasdiqlaydi.", "Odam tekshiruvi majburiy.", "v"], [246, "Which statement about editing is correct?", "Tahrirlash auditoriyaga moslash, faktlarni saqlash.", "Variantlar PDF'da yo'q.", "c"], [247, "In the seminar, a planted answer said \"Python was created in 2005 by Microsoft\". The correct facts are:", "Python'ni Guido van Rossum yaratgan va 1991-yilda chiqqan; Microsoft va 2005 noto'g'ri.", "Seminarda ataylab xato qo'yilgan.", "v"], [248, "Approximately how many levels does the CEFR scale have?", "Oltita daraja.", "A1, A2, B1, B2, C1, C2.", "v"], [249, "A student finds that a source exists but is behind a paywall. The honest approach is:", "Halol bo'ling: manbaga to'liq kira olmasangiz, uni o'qiganday ko'rsatmang; mavjud qismini yoki boshqa manbani ishlating.", "Tekshirilmagan da'voni tasdiqlangan deb yozmang.", "l"], [250, "Which is the correct sequence for a high-risk AI-generated financial figure?", "Birlamchi manbada tekshirish, mustaqil qayta hisoblash, odam tasdig'i.", "Moliyaviy raqamlar yuqori xavfli.", "v"]]};
</script>

window.W4={"t": "Models & Projects", "q": [[51, "The model selection triangle consists of:", "Tezlik, narx va sifat. Uchalasini birdan oshirib bo'lmaydi.", "Mock Q14: model tanlash = trade-off.", "v"], [52, "Labelling 1,000 reviews as positive/negative is best done with:", "Kichik, tez model (Haiku-sinf).", "Mock Q11: oddiy va ko'p hajmli ish.", "v"], [53, "Analysing a 50-page contract for risks justifies:", "Eng katta model (Opus-sinf).", "Mock Q12: 50–60 betlik shartnoma xavflarini tahlil qilish.", "v"], [54, "A token is approximately:", "So'z bo'lagi (taxminan 3–4 harf yoki so'zning ~3/4 qismi).", "Model matnni token'larga bo'lib o'qiydi va hisoblaydi.", "l"], [55, "The context window is:", "Model bir vaqtda ushlab tura oladigan matn miqdori.", "Mock glossariy: 'amount of text the model can hold at once'.", "v"], [56, "At message 40 the AI forgets the format requested at the start. The cause is most likely:", "Context window to'lib bormoqda: xulosa qilib yangi chatda davom eting yoki qoidalarni Project'ga ko'chiring.", "Mock Q20.", "v"], [57, "Which is a context-management technique?", "Xulosa qilib yangi chat ochish, doimiy qoidalarni Project'ga qo'yish, katta faylni boshida berish.", "To'rtinchi usul nomi slaydda tekshiriladi.", "l"], [58, "A recurring weekly task with standing rules is the classic case for:", "Project.", "Mock Q15: doimiy qoidalar va shablon bor takroriy ish.", "v"], [59, "The four parts of a Project are:", "Manba topilmadi: 4 qism slaydda. Ma'lum qismlar: ko'rsatmalar (instructions), fayllar (knowledge), Project ichidagi chatlar.", "To'rtinchisini slayddan tekshiring.", "c"], [60, "Which file should NOT be uploaded as Project knowledge?", "Shaxsiy ma'lumotli fayl: ism, telefon, baholar jadvali.", "Mock Q21.", "v"], [61, "Thirty mixed files in a Project and vaguer answers. Best fix:", "Keraksiz fayllarni olib tashlab, 3–5 ta tegishlisini qoldirish.", "Mock Q22: fayl ko'p bo'lsa javob xiralashadi.", "v"], [62, "A connector (e.g., Google Drive) does what?", "AI'ni ilovangizga (masalan Drive) ulaydi va fayllarni qo'lda yuklamay to'g'ridan-to'g'ri o'qiydi.", "Ruxsatlar bilan ishlaydi.", "l"], [63, "The right approach to connector permissions is:", "Eng kam ruxsat printsipi: kerakligini ulash, ruxsatlarni ko'rib chiqish, kerak bo'lmasa uzish.", "Ulagan narsangizni AI ko'radi.", "l"], [64, "Memory differs from Project instructions in that memory:", "Memory AI o'zi eslab qolgan narsa; Project ko'rsatmasi esa ongli yoziladi va Project ichida ishlaydi.", "Mock Q23.", "v"], [65, "A good Project instruction should include the sentence:", "Manba topilmadi. Mantiqan: 'Bilmasang yoki ma'lumot yetmasa, o'ylab topma, so'ra yoki taxminiy deb belgila.'", "Aniq iborani slayddan tekshiring.", "c"], [66, "Which concept pairs are equivalent across tools?", "Project ≈ Custom GPT/Gem, Artifacts ≈ Canvas, Research ≈ Deep Research, Haiku/Sonnet/Opus ≈ kichik/o'rta/katta.", "Bankdagi Q156, Q182, Q262 shuni aytadi.", "v"], [67, "Switching to a larger model is the right FIRST step when:", "Avval prompt va kontekst tuzatilgan bo'lsa va vazifa haqiqatan murakkab bo'lsa.", "Mock Q28: tashxis tartibi prompt → kontekst → ma'lumot → model.", "v"], [151, "A translation of 500 short product descriptions is best run on:", "Kichik, tez model.", "500 ta oddiy tarjima = oddiy va ko'p hajmli ish.", "v"], [152, "A strategic one-off analysis report for the rector justifies:", "Eng katta model.", "Bir martalik strategik tahlil: sifat narxdan muhim.", "l"], [153, "Uzbek text uses more tokens than English for the same content. A practical consequence is:", "Narx va limit tezroq ketadi, context tezroq to'ladi; promptni ixcham yozing, yangi chatni erta oching.", "Bir xil mazmun o'zbekchada ko'proq token oladi.", "l"], [154, "Which action best prevents the \"long conversation\" problem for a multi-day project?", "Davriy xulosa qilish va doimiy qoidalarni Project'da saqlash.", "Mock Q20.", "v"], [155, "Which task → feature pairing is correct?", "Takroriy ish: Project. Manbali yangi ma'lumot: Research. Kichik vosita: Artifact. Soatlab fayl va ilovalar bilan ish: agent.", "Har vazifaga o'z funksiyasi.", "l"], [156, "Custom GPTs and Gems are equivalents of which Claude concept?", "Project.", "Custom GPT va Gem ham doimiy ko'rsatma va fayl beradi.", "l"], [157, "An ACCA Project instruction says: \"Do not give ready answers to exam questions — give a solution plan.\" This is which part of the instruction anatomy?", "Cheklov (rule): nima qilmaslik kerak.", "'Tayyor javob berma, yechim rejasini ber' = qoida.", "l"], [158, "Which is appropriate Project knowledge for a tourism assistant?", "Narxlar jadvali, marshrutlar, kompaniya uslubi, FAQ va shablonlar: ochiq va shaxsiy ma'lumotsiz.", "Mijoz ma'lumoti yuklanmaydi.", "l"], [159, "A Project gives good answers in general but ignores a rule from the instructions. First thing to check:", "Ko'rsatmaning o'zini: aniqmi, ziddiyat yo'qmi, chat Project ichidami, context to'lmaganmi.", "Avval prompt va kontekst, keyin model.", "l"], [160, "When should a connector be disconnected?", "Ish tugaganda, kerak bo'lmaganda yoki ruxsati keragidan keng bo'lganda.", "Eng kam ruxsat printsipi.", "l"], [161, "Memory has saved something you did not want kept. The right action is:", "Sozlamalardan o'sha xotirani o'chiring; ish uchun Project ishlating.", "Memory qulaylik, Project esa nazoratli.", "l"], [162, "Which is the correct order of the configuration checklist?", "Manba topilmadi: tekshiruv ro'yxati tartibi slaydda.", "O'zim tartib o'ylab topmayman.", "c"], [163, "A business student uploads a 3-page template and the syllabus to a Project. The AI now formats reports correctly without being asked. Why?", "Shablon va silabus Project bilimiga kirgan, shu sabab har chatda avtomatik ishlaydi.", "Mock Q15.", "v"], [164, "Which is a realistic sign that the context window is nearly full?", "AI boshidagi ko'rsatma yoki formatni unutadi.", "Mock Q20: 40-xabardan keyin format yo'qoladi.", "v"], [165, "\"Start in the middle\" refers to which model for everyday work?", "Sonnet (o'rta model).", "Odatdagi ishni o'rtadan boshlang; oddiy ishda pastga, murakkabda yuqoriga.", "v"], [166, "Giving a 60-page file at the START of a chat rather than in the middle helps because:", "Fayl suhbat boshida ko'z oldida qoladi va uzun suhbatda siqib chiqarilmaydi.", "Boshi va oxiri yaxshi eslab qolinadi.", "l"], [167, "Which is NOT a legitimate reason to switch to a bigger model?", "'Katta model doim yaxshi' yoki promptni tuzatmaslik uchun.", "Asosli sabab: murakkab mantiq, prompt tuzatilganidan keyin ham xato.", "l"], [251, "A large model can be roughly how much more expensive per token than a small one, according to the lecture?", "Manba topilmadi: lecture'da aniq baravar (taxminan o'nlab marta) aytilgan.", "Raqamni o'ylab topmayman.", "c"], [252, "Which is a Domain-5 (configuration) topic?", "Projects, ko'rsatmalar, fayllar, connector va memory.", "Week 6 seminar jadvali: 5. Configuration, Projects (week 4).", "v"], [253, "Standing instructions in a Project should contain the same five elements as a prompt plus:", "Manba topilmadi: beshta element + qo'shimcha (masalan, cheklovlar yoki ma'lumot yetmasa nima qilish).", "Slayddan tekshiring.", "c"], [254, "Which is the most useful knowledge file for an ELT lesson-material Project?", "Dars shabloni, o'quv reja, CEFR tavsiflari, lug'at ro'yxati, uslub qo'llanmasi.", "Ochiq va ish uchun tegishli fayllar.", "l"], [255, "A business student reports the Project \"ignores\" the uploaded template. First thing to check:", "Shablon Project fayllarida borligini va ko'rsatmada uni ishlatish aytilganini tekshiring.", "Fayl yuklash o'zi ko'rsatma emas.", "l"], [256, "Which best describes a connector's advantage over manual upload?", "Joriy fayllarni to'g'ridan-to'g'ri o'qiydi va har safar qayta yuklash shart emas.", "Doim yangi nusxa bilan ishlaydi.", "l"], [257, "If a connector is unavailable on the free plan, students should:", "Fayllarni anonim qilib qo'lda yuklash.", "Connector bo'lmasa muqobil yo'l.", "l"], [258, "The rule \"for work use a Project; memory is convenience\" exists because:", "Memory nazoratsiz va noto'g'ri narsa saqlashi mumkin; Project esa ongli va boshqariladi.", "Mock Q23.", "v"], [259, "Which is the fourth context-management technique from the lecture?", "Manba topilmadi: to'rtinchi usul nomi slaydda.", "Ma'lum usullar: xulosa qilish, Project, faylni boshida berish.", "c"], [260, "For code that can be tested, which model size is usually sufficient?", "Kichik yoki o'rta model.", "Kodni testlash mumkin, xatoni test ushlaydi.", "l"], [261, "Which is a correct feature match for \"multi-hour work with files and applications\"?", "Agent (masalan Claude Cowork yoki Claude Code).", "Soatlab fayl va ilovalar bilan ishlaydi.", "l"], [262, "Deep research / Deep Research in other tools corresponds to Claude's:", "Research.", "Q74 va Q102: manbali hisobot.", "v"], [263, "What is a sensible number of knowledge files for a focused Project?", "3–5 ta.", "Mock Q22.", "v"], [264, "A tourism Project should answer with prices marked as estimates. Where is this rule placed?", "Project'ning doimiy ko'rsatmasida (standing instructions).", "Qoida bir marta yoziladi, har chatda ishlaydi.", "l"], [265, "Which symptom suggests the task is too heavy for the current model (step 4 of diagnosis)?", "Murakkab, ko'p bosqichli vazifada prompt yaxshi bo'lsa ham mantiqiy xatolar takrorlanishi.", "Faqat shundan keyin kattaroq model.", "l"], [266, "Where do all chats inside a Project share settings from?", "Project'dan: umumiy ko'rsatma va fayllar.", "Mock Q15.", "v"], [267, "An ACCA student's Project returns answers over 150 words despite the limit in the instructions. Best fix:", "Cheklovni qisqa va aniq qoida qilib yozing, ziddiyatni olib tashlang, yangi chatda sinang.", "Kontekst to'lgan bo'lishi ham mumkin.", "l"]]};
</script>

window.W5={"t": "Workflows & Agents", "q": [[68, "A workflow differs from a task because a workflow:", "Workflow ko'p qadamli takroriy jarayon: kirish, chiqish va nazorat nuqtalari bor; task esa bitta qadam.", "Zanjir shaklida ishlaydi.", "l"], [69, "The five questions for mapping a workflow include all EXCEPT:", "Manba topilmadi: 5 savol ro'yxati slaydda.", "Taxmin: maqsad, qadamlar, kirish/chiqish, xavf, kim bajaradi.", "c"], [70, "Which step is suitable for full automation by AI?", "Ma'lumotni jadvalga formatlash.", "Mock Q17: oddiy, xavfsiz qadam.", "v"], [71, "Where must human control points be placed?", "Qaytarib bo'lmaydigan amaldan oldin va qaror qabul qilinadigan joylarda.", "Mock Q19.", "v"], [72, "A prompt chain means:", "Promptlar zanjiri: har qadam natijasi keyingisining kirishi bo'ladi.", "Q180: yig'ish → tahlil → qoralama → tekshiruv → format.", "v"], [73, "The main difference between a chat and an agent is that an agent:", "Agent o'zi reja tuzadi va vositalar bilan bir necha qadamni bajaradi; chat esa bir martalik javob beradi.", "Shu sabab agentga nazorat kerak.", "l"], [74, "Which is an agent-type feature that searches the web and returns sourced reports?", "Research (Deep Research).", "Veb'ni qidirib manbali hisobot qaytaradi.", "v"], [75, "The four elements of an agent brief are:", "Natija (maqsad), chegaralar, nazorat nuqtasi va chiqish shakli.", "To'rtinchisining nomi slaydda tekshiriladi.", "c"], [76, "An agent emailed results to the whole team without being asked. What was missing?", "Chegaralar (scope limits) va yuborishdan oldingi tasdiq nuqtasi.", "Mock Q18.", "v"], [77, "Which is NOT one of the Artifact types from the lecture?", "Manba topilmadi: Artifact turlari ro'yxati slaydda.", "Bankdan: jadval, checklist, kalkulyator, quiz, sxema.", "c"], [78, "An Artifact specification should state:", "Maqsad, kirish ma'lumotlari, hisob-kitob mantiqi, ko'rinishi va kimga mo'ljallangani.", "Aniq spetsifikatsiya = kam tuzatish.", "l"], [79, "Which is a reasonable iteration request for an Artifact?", "Aniq o'zgarish: 'Juma kunini olib tashla, rang qo'sh'.", "Week 1 seminar.", "v"], [80, "HR reviews 200 CVs monthly. The most appropriate AI integration is:", "AI mezon bo'yicha CV'larni xulosa qiladi va jadvalga yig'adi; taklif qilish qarorini odam qabul qiladi.", "Mock Q16.", "v"], [81, "A safeguard against agent risk is:", "Chegaralar, tasdiq nuqtalari, eng kam ruxsat va harakat jurnalini o'qish.", "Mock Q18 va Q19.", "l"], [82, "On the free plan, the equivalent of an agent workflow is:", "Qo'lda promptlar zanjiri (Project yoki chat ichida).", "Agentning bepul reja muqobili.", "l"], [83, "Which is a typical workflow mistake?", "Nazorat nuqtalarisiz avtomatlashtirish yoki bir vaqtda juda ko'p narsani avtomatlashtirish.", "Q181.", "v"], [168, "In a tour-package workflow (request → route → price → offer → confirm), which step is \"human only\"?", "Tasdiqlash (confirm): oxirgi qaror va mijozga yuborish.", "Qaytarib bo'lmaydigan amal.", "l"], [169, "Which step of a month-end close is \"AI proposes, human approves\"?", "Tuzatish yozuvlarini taklif qilish: AI taklif qiladi, odam tasdiqlaydi.", "Yozishdan oldin nazorat.", "l"], [170, "A workflow step cannot be described with one verb. According to the lecture rule this means:", "Qadam hali aniq emas va uni kichik qadamlarga bo'lish kerak.", "Bir fe'l = bir qadam.", "l"], [171, "Why did the course teach prompt chains by hand before agents?", "Avval mantiq va nazoratni qo'lda tushunish kerak; agent xuddi shu zanjirni avtomatlashtiradi.", "Nimani tekshirishni bilmasangiz, agentga ishonib bo'lmaydi.", "l"], [172, "Which agent is specifically a developer agent?", "Claude Code (dasturchi agenti).", "Q283: Codex va Jules ham shunday vositalar.", "l"], [173, "\"Show me the plan first, then continue\" in an agent brief is a:", "Nazorat nuqtasi (checkpoint).", "Avval reja ko'rsatadi, tasdiqdan keyin davom etadi.", "v"], [174, "\"Only public websites; no more than 10 sites; send nothing\" in an agent brief is a:", "Chegaralar (boundaries).", "Mock Q18: ko'rsatilmagan chegaralar muammosi.", "v"], [175, "After an agent finishes, the user should:", "Harakat jurnalini o'qish, natijani va manbalarni tekshirish.", "Q279.", "l"], [176, "Which Artifact type suits \"a 10-item month-end checklist that can be ticked off\"?", "Checklist (belgilanadigan interaktiv ro'yxat).", "Month-end close 10 band.", "v"], [177, "A specification line \"calculate a percentage when items are ticked\" describes:", "Hisoblash mantiqi (funksional talab).", "Belgilanganda foiz o'zgaradi.", "l"], [178, "An ELT teacher wants a lesson plan plus a self-checking vocabulary quiz. The right outputs are:", "Dars rejasi (hujjat) va o'zini tekshiradigan lug'at testi (interaktiv Artifact).", "Ikki xil natija turi.", "l"], [179, "The 5-question checklist before building a workflow with AI asks about all EXCEPT:", "Manba topilmadi: 5 savol ro'yxati slaydda.", "Q69 bilan bir xil ro'yxat.", "c"], [180, "A sales report chain has steps collect → analyse → draft → check → format. Where does the \"check\" prompt get its input?", "Qoralama qadamining natijasi (oldingi qadam chiqishi) va asl ma'lumot yoki mezonlar.", "Zanjir shu tarzda ishlaydi.", "l"], [181, "Which outcome shows a workflow mistake of \"automation without control points\"?", "Agent ruxsatsiz hammaga xat yuborishi yoki to'lov o'tkazishi.", "Mock Q18.", "v"], [182, "Canvas (ChatGPT/Gemini) is the equivalent of:", "Artifacts.", "Q66.", "v"], [183, "An IT bug-tracking Artifact should NOT include:", "Shaxsiy ma'lumot va maxfiy kalitlar; faqat nomi, jiddiyligi, holati va qadamlar kerak.", "Xavfsizlik qoidasi.", "l"], [268, "In the HR example, which part of the work is \"repetitive + low risk\"?", "CV'larni mezon bo'yicha xulosa qilish, kontaktni jadvalga olish, formatlash.", "Mock Q16.", "v"], [269, "Why do standing rules not need repeating inside a prompt chain?", "Qoidalar Project'da turadi va zanjirdagi har chatga qo'llanadi.", "Mock Q15.", "v"], [270, "Which control point is placed \"at the input\"?", "Kirishda: ma'lumotni anonim qilish va tekshirish.", "Noto'g'ri yoki maxfiy ma'lumot ichkariga kirmasin.", "l"], [271, "A browser agent is risky mainly because it:", "Haqiqiy saytlar va akkauntlarda sizning nomingizdan bosadi, yuboradi yoki sotib oladi: qaytarib bo'lmaydi.", "Shu sabab chegara va tasdiq kerak.", "l"], [272, "\"A price table of 5 competing cafés in Tashkent, with sources\" is the brief's:", "Kutilgan natija (result).", "Manbali jadval = brief natijasi.", "l"], [273, "Which Artifact type suits a process scheme or timeline?", "Diagramma (sxema yoki vaqt chizig'i).", "Jarayon yoki vaqt tartibini ko'rsatadi.", "l"], [274, "Why write a specification before requesting an Artifact?", "AI nima yasashini aniq bilishi uchun va keyingi tuzatishlar kamayishi uchun.", "Noaniq so'rov noaniq natija beradi.", "l"], [275, "A tourism Artifact: \"total price changes with the number of people\". This is a specification line about:", "Hisoblash va interaktivlik mantiqi.", "Odamlar soni narxni o'zgartiradi.", "l"], [276, "How should an Artifact for the portfolio be evidenced?", "Skrinshot yoki yuklab olingan fayl va prompt/spetsifikatsiya.", "Week 1 seminar: portfolio bo'limi.", "v"], [277, "Which is the correct colour-coding meaning in the workflow map?", "Manba topilmadi. Mantiqan: yashil AI, sariq AI taklif qiladi va odam tasdiqlaydi, qizil faqat odam.", "Slayddagi ranglarni tekshiring.", "c"], [278, "An ACCA month-end close is automated end to end with no checkpoint before posting adjustments. The main risk is:", "Xatolar odam tekshirmasdan hisoblarga o'tadi.", "Qaytarib bo'lmaydigan amalda nazorat kerak.", "v"], [279, "Reading an agent's action log serves to:", "Agent nima qilganini tekshirish, og'ishlarni ushlash va javobgarlikni saqlash.", "Jurnal agent harakatining izi.", "l"], [280, "The ELT weekly workflow \"objective → material → adapt → task → assess → reflect\": which step is best kept human?", "Baholash (assess): o'qituvchi hukmi kerak.", "Pedagogik javobgarlik odamda.", "l"], [281, "Which is the agent-brief element most often missing in beginners' requests?", "Chegaralar va tasdiq nuqtasi.", "Mock Q18 aynan shu ikkitasi yo'q edi.", "v"], [282, "Which exported format fits a table Artifact for further work?", "CSV yoki XLSX.", "Keyingi ish uchun tahrirlanadigan jadval.", "l"], [283, "Codex and Jules were mentioned as other tools' equivalents of:", "Claude Code (dasturchi agenti).", "Q172.", "l"]]};
</script>
<script>
window.W6={"t": "Responsible use", "q": [[84, "Which data category may be freely given to AI?", "Ochiq ma'lumot (public).", "Week 6 seminar kartalari 1 va 9: ochiq yillik hisobot, ochiq narxlar.", "v"], [85, "A table of students' names, phones and grades is:", "Shaxsiy ma'lumot: o'zgarishsiz yuklanmaydi, anonim qilinadi.", "Mock Q24.", "v"], [86, "Anonymising data before uploading means:", "Ism va identifikatsiya qiluvchi tafsilotlarni olib tashlash, ID ishlatish.", "Mock glossariy: 'anonymise'.", "v"], [87, "Under Uzbekistan's Law \"On Personal Data\" (2019), processing someone's personal data requires:", "Egasining roziligi (yoki boshqa qonuniy asos).", "Qonunning asosiy talabi.", "l"], [88, "Which is NOT an element of an organisational AI policy?", "Manba topilmadi: siyosat elementlari ro'yxati slaydda.", "Elementlar: ma'lumot qoidalari, ruxsat etilgan vositalar, odam nazorati, oshkoralik, hodisa haqida xabar berish.", "c"], [89, "Academic integrity in this course requires AI use to be:", "Shaffof (e'lon qilingan), halol va tekshirilgan bo'lishi.", "Mock Q25.", "v"], [90, "A hiring tool rated one group lower because of historical data. This is:", "O'qitish ma'lumotidan kelgan tarafkashlik (bias); odam tekshiruvi majburiy.", "Mock Q27.", "v"], [91, "The diagnostic order when an answer is bad is:", "Prompt, keyin kontekst, keyin ma'lumot, oxirida model.", "Mock Q28 va seminar daraxti.", "v"], [92, "The AI answers in a mix of languages. The best fix is:", "Chiqish tilini ochiq yozing va toza chat oching.", "Mock Q30.", "v"], [93, "The AI refuses a request. The responsible response is:", "Maqsadni aniqlashtiring, maxfiy ma'lumotni olib tashlang, rad etilsa to'xtang.", "Mock Q26.", "v"], [94, "Trying to bypass an AI safeguard (\"jailbreaking\") is:", "Ruxsat etilmagan va mas'uliyatsiz harakat.", "Himoya mexanizmlarini aylanib o'tib bo'lmaydi.", "v"], [95, "Which optimisation makes a working but slow, expensive workflow better?", "Oddiy qadamlarga kichik model, murakkablariga katta model.", "Mock Q29.", "v"], [96, "Which CCAO-F domain has the largest weight (21%)?", "Verification (Domain 2, Week 3).", "Q292: Domain 2 = 21%.", "v"], [97, "In the exam, an option saying \"let the AI do everything and send automatically\" is:", "Noto'g'ri variant.", "Mock Q19: nazorat nuqtalari kerak.", "v"], [98, "A staff member wants to upload 120 students' surnames, phones and grades to find at-risk students. Most appropriate action:", "Ism va telefonni olib tashlab ID ishlatish, anonim jadvalni yuklash, natijani odam tekshiradi.", "Mock Q24.", "v"], [99, "Telling the AI \"do not store this data\" is:", "Xavfsizlik chorasi emas: ma'lumot baribir yuklangan bo'ladi.", "Mock Q24: A variant noto'g'ri.", "l"], [100, "Recommended exam-time habit:", "Qiyin savolni belgilab keyinga qoldiring, 3 daqiqadan oshirmang, bo'sh qoldirmang.", "Mock Exam ko'rsatmasi.", "v"], [184, "A marketer wants to analyse an unannounced product plan on a personal free AI account. The data category and decision are:", "Maxfiy ichki ma'lumot; shaxsiy bepul akkauntda ruxsat etilmaydi.", "Tasdiqlangan kompaniya vositasi yoki anonimlashtirish kerak.", "l"], [185, "A tourism manager uploads a client's passport scan and card number to fill a visa form. The correct decision is:", "Sezgiluvchi shaxsiy ma'lumot (pasport, karta): ruxsat etilmaydi.", "Qaror: yuklamaslik.", "l"], [186, "A developer sends a config file containing live API keys to the AI. Which rule was broken?", "Maxfiy kalitlar (secrets) yuklanmaydi; kalitni chiqarib tashlash va almashtirish kerak.", "Xavfsizlik qoidasi.", "l"], [187, "Which organisational policy element covers \"whom to inform if data leaks\"?", "Hodisa haqida xabar berish (incident reporting).", "Ma'lumot sizib chiqsa, kimga xabar berilishi.", "l"], [188, "The AI declaration template requires the student to state all EXCEPT:", "Manba topilmadi: shablonning aniq bandlari slaydda.", "Seminar: vositalar, maqsadlar va qanday tekshirilgani.", "c"], [189, "Upl <script>
